<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
<title>Книги</title>
</head>
<body>
<div id="view"></div>
<nav id="tabbar"></nav>
<div id="reader" hidden></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
  // внутри Telegram Mini App — тёмная тема как в клиенте и разворот на весь экран
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    const dark = tg.colorScheme !== 'light';
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    document.querySelector('meta[name=theme-color]').setAttribute('content', dark ? '#07090f' : '#f5f3ee');
    try { tg.setHeaderColor(dark ? '#07090f' : '#f5f3ee'); tg.setBackgroundColor(dark ? '#07090f' : '#f5f3ee'); } catch (e) {}
    tg.ready(); tg.expand();
    // запрет сворачивания приложения свайпом вниз (Bot API 7.7+)
    try { tg.disableVerticalSwipes(); } catch (e) {}
    // системная кнопка Telegram «Назад» вместо «Закрыть» везде, кроме главной
    try {
      const bb = tg.BackButton, upd = () => { const h = location.hash; (h && h !== '#' && h !== '#/') ? bb.show() : bb.hide(); };
      bb.onClick(() => history.back()); addEventListener('hashchange', upd); upd();
    } catch (e) {}
  }
</script>
<script src="app.js"></script>
</body>
</html>
